name: Feature
description: 新しい機能の追加や、既存機能の拡張に関するIssue
title: '[Feature] '
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: 既存Issueを検索して重複を避けてください。Secretの実値は記載しないでください。着手者はAssigneeとProject「やもんサイト」のStatusとScopeを設定します。
  - type: textarea
    id: field-1
    attributes:
      label: 背景
      description: なぜこの機能が必要なのか
    validations:
      required: true
  - type: textarea
    id: field-2
    attributes:
      label: やること
    validations:
      required: true
  - type: textarea
    id: field-3
    attributes:
      label: 完了条件
    validations:
      required: true
  - type: textarea
    id: field-4
    attributes:
      label: 補足
      description: 参考資料、スクリーンショット、関連Issueなど
    validations:
      required: false
  - type: textarea
    id: field-5
    attributes:
      label: 開発情報
      description: 着手する本人がSelect assignees（作成後はAssignees）で自分を設定してください。詳細はCONTRIBUTING.mdのAssignee・紐付けルールを参照。 Branch作成後に名前を記載し、Push後にリンクを追記。PR作成後にURLまたは番号を追記してください。
      value: |-
        - Branch: 未作成
        - Pull Request: 未作成
    validations:
      required: true
