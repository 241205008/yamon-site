name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR は新しい push が来たら古い実行を止める。main はデプロイを途中で止めないよう、順番に実行する。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy-ready: ${{ steps.secrets.outputs.ready }}
    steps:
      # アカウント準備（#14）が終わるまでは Secret がないので、失敗にせず警告を出してデプロイを省略する。
      # 依存パッケージのコードが動く前（npm ci より前）に判定し、後のステップから Secret が見えないようにする
      - name: Check deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため、デプロイを省略します（README の「デプロイ」を参照）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # テストに通ったビルドと Pages Functions（functions/、地図データの配信 D28）を、そのままデプロイに使う。
      # 2つの共通の親（apps/web）からの相対パスで入るので、Artifact の中は dist/ と functions/ になる
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            apps/web/dist
            apps/web/functions
            !apps/web/functions/**/*.test.ts
            !apps/web/functions/tsconfig.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy (Cloudflare Pages)
    needs: check
    # main への push・main の手動実行は本番、それ以外（同じリポジトリからの PR など）はプレビュー。
    # フォークや Dependabot の PR には Secret が渡らないため、deploy-ready が false になり実行しない。
    if: needs.check.outputs.deploy-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # PR は pr-<番号> の名前でプレビューにする（head が main でも本番に出ないように）。
      # それ以外の Branch 名はコマンドに埋め込む前に英数字とハイフンだけにする
      - name: Resolve branch
        id: branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RAW_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            branch="pr-$PR_NUMBER"
          else
            branch=$(printf '%s' "$RAW_BRANCH" | tr -c 'A-Za-z0-9-' '-')
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      # checkout はしない。wrangler は実行場所の functions/ を読んで Functions としてデプロイする。
      # node_modules がないため、functions/ からは相対パスのファイルだけを import できる
      # （npm のパッケージや @yamon/shared を値として import すると失敗する。import type は可）
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'yamon-site' }} --branch=${{ steps.branch.outputs.name }}

      - name: Summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### デプロイ完了"
            echo "- URL: $DEPLOYMENT_URL"
            if [ -n "$ALIAS_URL" ]; then echo "- Branch の URL: $ALIAS_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
