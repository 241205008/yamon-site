name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR は新しい push が来たら古い実行を止める。main はデプロイを途中で止めないよう、順番に実行する。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy-ready: ${{ steps.secrets.outputs.ready }}
    steps:
      # アカウント準備（#14）が終わるまでは Secret がないので、失敗にせず警告を出してデプロイを省略する。
      # 依存パッケージのコードが動く前（npm ci より前）に判定し、後のステップから Secret が見えないようにする
      - name: Check deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため、デプロイを省略します（README の「デプロイ」を参照）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # テストに通ったビルドと Worker（worker/。地図データの配信 worker/map/ を含む。D42）を、そのままデプロイに使う。
      # 共通の親（apps/web）からの相対パスで入るので、Artifact の中は dist/・worker/・wrangler.jsonc になる
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            apps/web/dist
            apps/web/worker
            apps/web/wrangler.jsonc
            !apps/web/**/*.test.ts
            !apps/web/worker/tsconfig.json
          if-no-files-found: error
          retention-days: 7

  # API のコンテナ（Cloud Run 用）がビルドでき、本物の PostgreSQL にマイグレーションを流して起動できるかを確かめる。
  # テスト（PGlite）では分からない、Dockerfile・ビルド結果・postgres.js での接続の壊れを見つける
  api-image:
    name: API image (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # 本番の Neon と同じメジャーバージョン
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f apps/api/Dockerfile -t yamon-api .
      - name: Migrate (2回流しても失敗しない)
        run: |
          docker run --rm --network host -e DATABASE_URL yamon-api node dist/migrate.js
          docker run --rm --network host -e DATABASE_URL yamon-api node dist/migrate.js
      - name: Start and call /api/health
        run: |
          docker run -d --name api --network host -e DATABASE_URL yamon-api
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  deploy:
    name: Deploy (Cloudflare Workers)
    needs: check
    # main への push・main の手動実行は本番、それ以外（同じリポジトリからの PR など）はプレビュー。
    # フォークや Dependabot の PR には Secret が渡らないため、deploy-ready が false になり実行しない。
    if: needs.check.outputs.deploy-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # main（push・手動実行）は本番へ wrangler deploy。それ以外はプレビューとして版だけ上げる（本番は変わらない）。
      # PR は pr-<番号> の名前にする（head が main でも本番に出ないように）。
      # それ以外の Branch 名は、コマンドに埋め込む前に英小文字・数字・ハイフンだけにし、URL に収まる長さに切る。
      # Worker がまだない（初回の本番デプロイ前の）ときは、プレビューの版を上げられず失敗する
      - name: Resolve command
        id: target
        env:
          IS_PRODUCTION: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RAW_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            echo "command=deploy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PR_NUMBER" ]; then
            alias="pr-$PR_NUMBER"
          else
            # 別名は英字で始める必要があるので、Branch 名の前に b- を付ける
            alias="b-$(printf '%s' "$RAW_BRANCH" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9-' '-' | cut -c1-38)"
            alias=$(printf '%s' "$alias" | sed 's/-*$//')
          fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "command=versions upload --preview-alias $alias" >> "$GITHUB_OUTPUT"

      # checkout はしない。Artifact を展開した場所の wrangler.jsonc を読み、worker/index.ts を束ねてデプロイする。
      # node_modules がないため、worker/ からは相対パスのファイルだけを import できる
      # （npm のパッケージや @yamon/shared を値として import すると失敗する。import type は可）
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: ${{ steps.target.outputs.command }}

      - name: Summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          ALIAS: ${{ steps.target.outputs.alias }}
        run: |
          {
            echo "### デプロイ完了"
            echo "- URL: $DEPLOYMENT_URL"
            if [ -n "$ALIAS" ]; then
              alias_url=$(printf '%s' "$COMMAND_OUTPUT" | grep -oE "https://${ALIAS}-[a-z0-9.-]+\.workers\.dev" | head -n 1)
              if [ -n "$alias_url" ]; then echo "- プレビュー（${ALIAS}）の URL: $alias_url"; fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
